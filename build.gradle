        readmeFile.setText("""# Isolated Android Studio Test Environment

This directory contains an isolated Android Studio sandbox for testing the local ${pluginName} plugin build.

## Layout

- `config/`: isolated IDE config
- `system/`: caches and sandbox system data
- `log/`: IDE logs
- `plugins/${pluginName}/`: plugin files unpacked from the current distribution ZIP built by this project
- `idea.properties`: custom IDE path overrides
- `studio.vmoptions`: isolated VM options, avoiding reuse of the default user `studio.vmoptions`
- `launch-android-studio-isolated.sh`: macOS launcher script
- `launch-android-studio-isolated.cmd`: Windows launcher script
${isMac ? '- `Android Studio CCGUI Isolated.app`: macOS wrapper app containing the isolated launcher' : '- `Android Studio CCGUI Isolated.app`: only generated on macOS'}

## Usage

macOS:

```bash
./build/android-studio-isolated/launch-android-studio-isolated.sh
```

Windows:

```bat
build\\android-studio-isolated\\launch-android-studio-isolated.cmd
```

## Runtime Selection

On macOS, the wrapper directly invokes the Android Studio JBR instead of the native `studio` launcher, avoiding the default `AndroidStudio2025.3.3` path selector being injected back into the process.
The macOS wrapper prefers the selector-specific `studio.jdk` under `${macSelectorHomePlaceholder}/studio.jdk`. If that file is missing, it auto-initializes it from the latest installed `~/Library/Java/JetBrainsRuntime/jbr_jcef-*` and falls back to `${androidStudioJbrMac}`.
On Windows, the launcher relies on `studio64.exe` plus isolated selector/config paths and prefers the selector-specific `studio.jdk` under `${windowsSelectorHomePlaceholder}\\studio.jdk`, falling back to `${androidStudioJbrWindows}`.

## Local Overrides

You can override the Android Studio installation path in `local.properties` before running `./gradlew prepareIsolatedAndroidStudioTestEnv`:

```properties
android.studio.mac.app=/Applications/Android Studio.app
android.studio.windows.dir=C:\\Program Files\\Android\\Android Studio
```

Only set the property that matches the machine you are generating on.

## Verification Status

- macOS launcher generation and selector-specific `studio.jdk` reuse have been verified on this project.
- Windows launcher generation is implemented, but runtime behavior still needs to be verified on an actual Windows machine before treating it as production-proven.

## Notes

The config/system/plugins/log/vmoptions are isolated under `build/android-studio-isolated/`.
The plugin loaded by this environment comes from the current `build/distributions/${pluginName}-${project.version}.zip`, so each rerun uses the latest build output from the current project workspace.
""".stripIndent(), 'UTF-8')

