\$(python3 - <<'PY' "\$PRODUCT_INFO_JSON" "\$ANDROID_STUDIO_APP"
import json
import sys

product_info_path = sys.argv[1]
android_studio_app = sys.argv[2]
app_package = android_studio_app
contents_dir = f"{android_studio_app}/Contents"
